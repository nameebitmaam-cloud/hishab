<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hishab">
<title>Hishab · Quick Log</title>
<style>
  :root{
    --paper:#F1F4F0; --surface:#FFFFFF; --ink:#171A17; --muted:#6B726C;
    --line:#E2E6E1; --line-strong:#CDD4CC; --pine:#2C5F4F;
    --in:#1E7A5A; --out:#A63D40; --radius:14px;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.4;padding:0 0 40px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 14px;}
  header .title{font-size:20px;font-weight:700;letter-spacing:-0.02em;}
  header .title span{color:var(--pine);}
  .headright{display:flex;align-items:center;gap:10px;}
  .sub{font-size:12px;color:var(--muted);font-family:var(--mono);}
  .gear{border:1px solid var(--line-strong);background:var(--surface);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:14px;}
  .row-top{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
  .date-field{flex:1;}
  label.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:0 0 7px 2px;font-weight:600;}
  input[type="date"],input[type="password"],input.desc,select.field{
    width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;outline:none;
  }
  input[type="date"]{font-family:var(--mono);}
  input:focus,select.field:focus{border-color:var(--pine);}

  .select-wrap{position:relative;}
  .select-wrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none;}
  select.field{appearance:none;-webkit-appearance:none;-moz-appearance:none;padding-right:34px;cursor:pointer;}
  select.field.placeholder{color:var(--muted);}

  .amount-block{display:flex;align-items:stretch;gap:10px;margin-bottom:4px;}
  .amount-wrap{flex:1;display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px;}
  .amount-wrap:focus-within{border-color:var(--pine);}
  .cur{font-size:26px;color:var(--muted);font-family:var(--mono);}
  input.amount{flex:1;width:100%;border:none;background:transparent;outline:none;font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);padding:6px 0;min-width:0;}
  input.amount.is-out{color:var(--out);} input.amount.is-in{color:var(--in);}
  .toggle{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:70px;flex:none;}
  .toggle button{flex:1;border:none;background:var(--surface);color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:0.02em;padding:0;cursor:pointer;}
  .toggle button.on[data-dir="out"]{background:var(--out);color:#fff;}
  .toggle button.on[data-dir="in"]{background:var(--in);color:#fff;}
  .toggle button+button{border-top:1px solid var(--line);}

  .section{margin-top:16px;}
  .two-col{display:flex;gap:10px;} .two-col > div{flex:1;}

  .addleg{margin-top:14px;background:none;border:1px dashed var(--line-strong);color:var(--muted);border-radius:10px;padding:10px;width:100%;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;}
  .leg{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .leg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .leg-head .lbl{margin:0;}
  .leg-remove{background:none;border:none;color:var(--out);font-size:13px;font-weight:600;cursor:pointer;padding:0;}
  .hidden{display:none;}

  .save{margin-top:16px;width:100%;background:var(--pine);color:#fff;border:none;border-radius:12px;padding:15px;font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:0.01em;cursor:pointer;}
  .save:active{opacity:.9;}
  .save:disabled{background:var(--line-strong);color:#fff;}

  .util-row{display:flex;gap:8px;margin-bottom:14px;}
  .minibtn{flex:1;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;}
  .minibtn.danger{color:var(--out);border-color:#E7C9CB;}
  .minibtn.accent{background:var(--pine);color:#fff;border-color:var(--pine);}

  .pending-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;}
  .pending-head .t{font-size:14px;font-weight:700;}
  .pending-head .t b{color:var(--out);}

  .ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .meta{flex:1;min-width:0;}
  .item .l1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .l2{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
  .item .amt{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap;}
  .item .amt.out{color:var(--out);} .item .amt.in{color:var(--in);}
  .item .x{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 4px;cursor:pointer;}

  .settings-panel{margin-bottom:14px;}
  .hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .status-dot.ok{background:var(--in);} .status-dot.bad{background:var(--out);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">Hi<span>shab</span> · log</div>
    <div class="headright">
      <div class="sub" id="queueCount">synced</div>
      <button class="gear" id="gearBtn" type="button">⚙</button>
    </div>
  </header>

  <!-- SETTINGS -->
  <div class="card settings-panel hidden" id="settingsPanel">
    <label class="lbl">Sheet secret</label>
    <input type="password" id="secretInput" placeholder="Enter the secret from your script" autocomplete="off">
    <div class="hint" id="secretStatus"></div>
    <button class="save" id="saveSecret" style="margin-top:12px;">Save secret on this device</button>
  </div>

  <!-- ENTRY CARD -->
  <div class="card">
    <div class="row-top">
      <div class="date-field">
        <label class="lbl">Date</label>
        <input type="date" id="date">
      </div>
    </div>

    <label class="lbl">Amount</label>
    <div class="amount-block">
      <div class="amount-wrap">
        <span class="cur">৳</span>
        <input class="amount is-out" id="amount" inputmode="decimal" placeholder="0" autocomplete="off">
      </div>
      <div class="toggle" id="dirToggle">
        <button type="button" data-dir="out" class="on">Out</button>
        <button type="button" data-dir="in">In</button>
      </div>
    </div>

    <div class="section two-col">
      <div>
        <label class="lbl">Category</label>
        <div class="select-wrap"><select class="field placeholder" id="cat"></select></div>
      </div>
      <div>
        <label class="lbl">Account</label>
        <div class="select-wrap"><select class="field placeholder" id="acct"></select></div>
      </div>
    </div>

    <button type="button" class="addleg" id="addLeg">+ add second account (transfer)</button>
    <div class="leg hidden" id="legPanel">
      <div class="leg-head">
        <label class="lbl">Second account</label>
        <button type="button" class="leg-remove" id="removeLeg">remove</button>
      </div>
      <div class="amount-block">
        <div class="amount-wrap">
          <span class="cur">৳</span>
          <input class="amount is-in" id="amount2" inputmode="decimal" placeholder="0" autocomplete="off">
        </div>
        <div class="toggle" id="dirToggle2">
          <button type="button" data-dir="out">Out</button>
          <button type="button" data-dir="in" class="on">In</button>
        </div>
      </div>
      <div class="select-wrap" style="margin-top:12px;"><select class="field placeholder" id="acct2"></select></div>
    </div>

    <div class="section">
      <label class="lbl">Description</label>
      <input class="desc" id="desc" placeholder="e.g. Rickshaw to Mirpur DOHS" autocomplete="off">
    </div>

    <button class="save" id="save">Save to sheet</button>
  </div>

  <div class="util-row">
    <button class="minibtn danger" id="undoBtn">Undo last entry</button>
    <button class="minibtn accent hidden" id="syncBtn">Sync queued</button>
  </div>

  <div class="pending-head">
    <div class="t">Queued (offline) <b id="qNum">0</b></div>
  </div>
  <div class="ledger" id="ledger">
    <div class="empty">Nothing queued. Entries only sit here if you were offline when saving.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxUHLiUkJlMCbYpAF33-gjmmPygsMpjDkILk137HbpQUOIDPKv_0ArywO90KT343aLvQw/exec";
  var CATS = ["Epilogue","Food","Gift","Home","Loan","Personal","Pubu","Transfer","Transport"];
  var ACCTS = ["SCB","UCB","Bkash","Cash","Savings","Reserve"];
  var ACCT_KEY = { SCB:"scb", UCB:"ucb", Bkash:"bkash", Cash:"cash", Savings:"savings", Reserve:"reserve" };
  var QUEUE_KEY = "hishab_queue_v1";
  var SECRET_KEY = "hishab_secret_v1";

  var state = { dir:"out", dir2:"in", legOpen:false };
  var queue = [];

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- secret ---------- */
  function getSecret(){ try{ return localStorage.getItem(SECRET_KEY) || ""; }catch(e){ return ""; } }
  function setSecret(v){ try{ localStorage.setItem(SECRET_KEY, v); }catch(e){} }

  function refreshSecretStatus(){
    var s = getSecret();
    var el = $("secretStatus");
    if(s){
      el.innerHTML = '<span class="status-dot ok"></span>Secret is set on this device.';
    } else {
      el.innerHTML = '<span class="status-dot bad"></span>No secret set — saves will fail until you set one.';
    }
  }

  $("gearBtn").addEventListener("click", function(){
    $("settingsPanel").classList.toggle("hidden");
    $("secretInput").value = "";
    refreshSecretStatus();
  });
  $("saveSecret").addEventListener("click", function(){
    var v = $("secretInput").value.trim();
    if(!v){ toast("Enter a secret first"); return; }
    setSecret(v);
    $("secretInput").value = "";
    refreshSecretStatus();
    toast("Secret saved on this device");
    $("settingsPanel").classList.add("hidden");
  });

  /* ---------- queue storage ---------- */
  function loadQueue(){
    try{ var raw = localStorage.getItem(QUEUE_KEY); queue = raw ? JSON.parse(raw) : []; }
    catch(e){ queue = []; }
    renderQueue();
  }
  function persistQueue(){
    try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); }catch(e){}
  }

  /* ---------- selects ---------- */
  function fillSelect(sel, items, placeholder){
    sel.innerHTML = "";
    var o0 = document.createElement("option");
    o0.value=""; o0.textContent=placeholder; o0.disabled=true; o0.selected=true;
    sel.appendChild(o0);
    items.forEach(function(name){
      var o=document.createElement("option"); o.value=name; o.textContent=name;
      sel.appendChild(o);
    });
  }
  fillSelect($("cat"), CATS, "Select category");
  fillSelect($("acct"), ACCTS, "Select account");
  fillSelect($("acct2"), ACCTS, "Select account");
  function wirePlaceholder(sel, onChange){
    sel.addEventListener("change", function(){
      sel.classList.toggle("placeholder", sel.value==="");
      if(onChange) onChange();
    });
  }
  wirePlaceholder($("cat"), refreshSave);
  wirePlaceholder($("acct"), refreshSave);
  wirePlaceholder($("acct2"), null);

  /* ---------- toggles ---------- */
  function wireToggle(toggleEl, amountEl, which){
    Array.prototype.forEach.call(toggleEl.children, function(btn){
      btn.addEventListener("click", function(){
        Array.prototype.forEach.call(toggleEl.children, function(b){ b.classList.remove("on"); });
        btn.classList.add("on");
        var dir = btn.dataset.dir;
        if(which===1){ state.dir=dir; } else { state.dir2=dir; }
        amountEl.classList.toggle("is-out", dir==="out");
        amountEl.classList.toggle("is-in", dir==="in");
      });
    });
  }
  wireToggle($("dirToggle"), $("amount"), 1);
  wireToggle($("dirToggle2"), $("amount2"), 2);

  $("addLeg").addEventListener("click", function(){
    state.legOpen = true;
    $("legPanel").classList.remove("hidden");
    $("addLeg").classList.add("hidden");
  });
  $("removeLeg").addEventListener("click", function(){
    state.legOpen = false;
    $("amount2").value = "";
    $("acct2").value=""; $("acct2").classList.add("placeholder");
    $("legPanel").classList.add("hidden");
    $("addLeg").classList.remove("hidden");
  });

  function today(){
    var d = new Date(), p=function(n){return (n<10?"0":"")+n;};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  $("date").value = today();

  function ddmmyyyy(iso){
    if(!iso) return "";
    var parts = iso.split("-");
    return parts[2]+"/"+parts[1]+"/"+parts[0];
  }
  function signed(dir, raw){
    var n = parseFloat(String(raw).replace(/,/g,""));
    if(isNaN(n)) return null;
    n = Math.abs(n);
    return dir==="out" ? -n : n;
  }
  function round2(n){ return Math.round(n*100)/100; }
  function fmt(n){ return round2(n).toString(); }

  function refreshSave(){
    var amt = parseFloat(String($("amount").value).replace(/,/g,""));
    $("save").disabled = !( !isNaN(amt) && amt!==0 && $("cat").value && $("acct").value );
  }
  $("amount").addEventListener("input", function(){
    $("amount").classList.toggle("is-out", state.dir==="out");
    $("amount").classList.toggle("is-in", state.dir==="in");
    refreshSave();
  });

  /* ---------- build payload row from an entry ---------- */
  function buildRow(entry){
    var row = { date: ddmmyyyy(entry.date), type: entry.cat, desc: entry.desc || "",
      scb:"", ucb:"", bkash:"", cash:"", savings:"", reserve:"" };
    row[ACCT_KEY[entry.acct]] = round2(entry.amt);
    if(entry.acct2){ row[ACCT_KEY[entry.acct2]] = round2(entry.amt2); }
    return row;
  }

  /* ---------- network ---------- */
  function postToSheet(payload){
    // text/plain avoids a CORS preflight that Apps Script can't answer
    return fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); });
  }

  /* ---------- save ---------- */
  function readForm(){
    var a1 = signed(state.dir, $("amount").value);
    var cat=$("cat").value, acct=$("acct").value;
    if(a1===null || a1===0 || !cat || !acct) return null;
    var entry = {
      id: Date.now()+"-"+Math.random().toString(36).slice(2,6),
      date: $("date").value, cat:cat, acct:acct, amt:a1,
      desc: $("desc").value.trim(), acct2:null, amt2:null
    };
    if(state.legOpen && $("acct2").value){
      var a2 = signed(state.dir2, $("amount2").value);
      if(a2!==null && a2!==0){ entry.acct2 = $("acct2").value; entry.amt2 = a2; }
    }
    return entry;
  }

  $("save").addEventListener("click", function(){
    var entry = readForm();
    if(!entry){ toast("Fill amount, category, account"); return; }
    var secret = getSecret();
    if(!secret){ toast("Set your secret first (⚙)"); $("settingsPanel").classList.remove("hidden"); refreshSecretStatus(); return; }

    $("save").disabled = true; $("save").textContent = "Saving…";
    var row = buildRow(entry);

    postToSheet({ secret: secret, entries: [row] })
      .then(function(res){
        if(res && res.ok){
          toast("Saved to sheet ✓");
          resetForm();
        } else {
          toast("Rejected: " + (res && res.error ? res.error : "unknown error"));
          $("save").textContent = "Save to sheet"; $("save").disabled=false;
        }
      })
      .catch(function(){
        queue.push(entry);
        persistQueue(); renderQueue();
        toast("Offline — queued (" + queue.length + ")");
        resetForm();
      });
  });

  function resetForm(){
    $("amount").value=""; $("desc").value="";
    $("cat").value=""; $("cat").classList.add("placeholder");
    $("acct").value=""; $("acct").classList.add("placeholder");
    state.dir="out";
    Array.prototype.forEach.call($("dirToggle").children,function(b){ b.classList.toggle("on", b.dataset.dir==="out"); });
    $("amount").classList.remove("is-in"); $("amount").classList.add("is-out");
    state.legOpen=false; $("amount2").value="";
    $("acct2").value=""; $("acct2").classList.add("placeholder");
    $("legPanel").classList.add("hidden"); $("addLeg").classList.remove("hidden");
    state.dir2="in";
    Array.prototype.forEach.call($("dirToggle2").children,function(b){ b.classList.toggle("on", b.dataset.dir==="in"); });
    $("amount2").classList.remove("is-out"); $("amount2").classList.add("is-in");
    $("save").textContent="Save to sheet";
    $("save").disabled=true;
  }

  /* ---------- undo ---------- */
  $("undoBtn").addEventListener("click", function(){
    var secret = getSecret();
    if(!secret){ toast("Set your secret first (⚙)"); return; }
    if(!confirm("Remove the last row added to your sheet?")) return;
    postToSheet({ secret: secret, action: "undo" })
      .then(function(res){
        toast(res && res.ok ? "Last entry removed" : "Undo failed: " + (res.error||""));
      })
      .catch(function(){ toast("Couldn't reach the sheet — check connection"); });
  });

  /* ---------- queue (offline) ---------- */
  function renderQueue(){
    var L = $("ledger");
    $("qNum").textContent = queue.length;
    $("queueCount").textContent = queue.length ? (queue.length + " queued") : "synced";
    $("syncBtn").classList.toggle("hidden", queue.length===0);
    if(queue.length===0){
      L.innerHTML = '<div class="empty">Nothing queued. Entries only sit here if you were offline when saving.</div>';
      return;
    }
    L.innerHTML = "";
    queue.forEach(function(e){
      var item = document.createElement("div"); item.className="item";
      var meta = document.createElement("div"); meta.className="meta";
      var l1 = document.createElement("div"); l1.className="l1";
      l1.textContent = e.desc && e.desc.length ? e.desc : e.cat;
      var l2 = document.createElement("div"); l2.className="l2";
      var acctLine = e.acct + (e.acct2 ? " → "+e.acct2 : "");
      l2.textContent = ddmmyyyy(e.date) + "  ·  " + e.cat + "  ·  " + acctLine;
      meta.appendChild(l1); meta.appendChild(l2);
      var amt = document.createElement("div");
      amt.className = "amt " + (e.amt<0?"out":"in");
      amt.textContent = (e.amt<0?"−":"+") + "৳" + fmt(Math.abs(e.amt));
      var x = document.createElement("button"); x.className="x"; x.innerHTML="&times;";
      x.addEventListener("click", function(){
        queue = queue.filter(function(p){ return p.id!==e.id; });
        persistQueue(); renderQueue();
      });
      item.appendChild(meta); item.appendChild(amt); item.appendChild(x);
      L.appendChild(item);
    });
  }

  $("syncBtn").addEventListener("click", function(){
    if(queue.length===0) return;
    var secret = getSecret();
    if(!secret){ toast("Set your secret first (⚙)"); return; }
    $("syncBtn").disabled = true; $("syncBtn").textContent = "Syncing…";
    var rows = queue.map(buildRow);
    postToSheet({ secret: secret, entries: rows })
      .then(function(res){
        if(res && res.ok){
          toast("Synced " + rows.length + " entries");
          queue = []; persistQueue(); renderQueue();
        } else {
          toast("Sync failed: " + (res && res.error ? res.error : "unknown error"));
        }
        $("syncBtn").disabled=false; $("syncBtn").textContent="Sync queued";
      })
      .catch(function(){
        toast("Still offline — try again later");
        $("syncBtn").disabled=false; $("syncBtn").textContent="Sync queued";
      });
  });

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg){
    var t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },2000);
  }

  refreshSave();
  loadQueue();
  if(!getSecret()){ $("settingsPanel").classList.remove("hidden"); refreshSecretStatus(); }
})();
</script>
</body>
</html>
